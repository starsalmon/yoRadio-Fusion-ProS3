; yoRadio Fusion: one codebase, one env per device (board config in boards/<device>.h).
;   yoradio-um_pros3-ili9341   Unexpected Maker ProS3 + ILI9341 (+ HiGrow BT companion)
;   aprils-speaker             Unexpected Maker FeatherS3 + Pirate Audio HAT
; Build one env at a time:  pio run -e <env>
[platformio]
default_envs = yoradio-um_pros3-ili9341
extra_configs =
    platformio_private.ini

[env:yoradio-um_pros3-ili9341]
platform = espressif32@55.3.36
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6.tar.xz
    platformio/framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6-libs.tar.xz
board = um_pros3
framework = arduino

extra_scripts =
    pre:tools/pio/apply_audio_idf_mod.py
    pre:tools/pio/patch_sd_shared_spi.py
    pre:tools/pio/ha_board_meta.py
    pre:tools/pio/pre_fs_generate_logos.py
    tools/pio/fw_guard.py

build_flags =
    -DSD_SHARE_TFT_SPI=1
    ; sd_diskio.cpp read-path fixes (CMD12 / retry stalls), see tools/pio/patch_sd_shared_spi.py
    -DYORADIO_SD_DISKIO_FIX=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -Wl,--wrap=esp_mbedtls_mem_calloc
    ; stream diag (1 s stream/decoder/I2S summary): uncomment to enable
    ; -DYORADIO_STREAM_DIAG=1
    -DYORADIO_STREAM_DIAG=1
    -DYORADIO_HANG_DIAG=1
    -O2 

build_unflags = -std=gnu++17

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram = qspi

board_build.partitions = partitions/partition_16MB_ota_spiffs_bigspiffs.csv
board_build.filesystem = spiffs

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9341
    adafruit/Adafruit MAX1704X
    adafruit/Adafruit NeoPixel
    bitbank2/JPEGDEC

; ipc1 stack canary crash at BT boot: IDF default IPC task stack (1024) is too small.
; Hybrid-compiles the Arduino libs with this override (first build is slow).
custom_sdkconfig =
    CONFIG_ESP_IPC_TASK_STACK_SIZE=4096
custom_component_remove =
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp_rainmaker
    espressif/rmaker_common

upload_speed = 921600
upload_protocol = esptool
upload_flags =
    --chip=esp32s3
    --before=default_reset
    --after=hard_reset
    --baud=921600

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0



; ---------------------------------------------------------------------------------------------
; April's Speaker: Unexpected Maker FeatherS3 (16 MB QSPI flash, 8 MB QSPI PSRAM) + Pimoroni Pirate
; Audio 3W Amp HAT (ST7789 240x240, PCM5102A) + microSD on the display's SPI bus.
; Board config: boards/aprils_speaker.h (pins PROPOSED, PCB not final).
; Same custom_sdkconfig / component_remove as the ProS3 env, so both envs use the same hybrid
; Arduino libs (switching envs must not reinstall the framework and drop the lwip/SD patches);
; fw_guard.py rejects the image if they are missing anyway.
; Upload is refused unless upload_port is the FeatherS3 (platformio_private.ini, gitignored).
[env:aprils-speaker]
platform = espressif32@55.3.36
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6.tar.xz
    platformio/framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6-libs.tar.xz
board = um_feathers3
framework = arduino

extra_scripts =
    pre:tools/pio/apply_audio_idf_mod.py
    pre:tools/pio/patch_sd_shared_spi.py
    pre:tools/pio/ha_board_meta.py
    pre:tools/pio/pre_fs_generate_logos.py
    pre:tools/pio/per_env_data_dir.py
    pre:tools/pio/verify_aprils_speaker_upload.py
    tools/pio/fw_guard.py

custom_data_overlay = boards/aprils_speaker/data

build_flags =
    -DYORADIO_BOARD_APRILS_SPEAKER=1
    ; src/Adafruit_ST7735_and_ST7789_Library/Adafruit_ST7789.cpp reads the glass offsets without the board header
    -DTFT_COL_OFFSET=0
    -DTFT_ROW_OFFSET=0
    -DSD_SHARE_TFT_SPI=1
    -DYORADIO_SD_DISKIO_FIX=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -Wl,--wrap=esp_mbedtls_mem_calloc
    -O2

build_unflags = -std=gnu++17

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram = qspi
board_build.partitions = partitions/partition_16MB_ota_spiffs_bigspiffs.csv
board_build.filesystem = spiffs

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9341
    adafruit/Adafruit MAX1704X
    adafruit/Adafruit NeoPixel
    bitbank2/JPEGDEC

custom_sdkconfig =
    CONFIG_ESP_IPC_TASK_STACK_SIZE=4096
custom_component_remove =
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp_rainmaker
    espressif/rmaker_common

upload_speed = 921600
upload_protocol = esptool
upload_flags =
    --chip=esp32s3
    --before=default_reset
    --after=hard_reset
    --baud=921600
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
